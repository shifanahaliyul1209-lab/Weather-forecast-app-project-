<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast App</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

  <h1 class="text-3xl font-bold text-slate-800 mb-6">Weather Forecast</h1>

  <!-- Search section -->
  <div class="flex gap-2 mb-4">
    <input
      type="text"
      id="cityInput"
      placeholder="Enter a city name"
      class="px-4 py-2 rounded-lg border border-slate-300 w-64 focus:outline-none focus:ring-2 focus:ring-blue-400"
    >
    <button
      id="searchBtn"
      class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600"
    >
      Search
    </button>
  </div>

  <button
    id="locationBtn"
    class="mb-6 px-4 py-2 bg-slate-600 text-white rounded-lg hover:bg-slate-700"
  >
    Use Current Location
  </button>

  <!-- Recent cities dropdown will go here later -->
  <div id="recentCities" class="mb-4"></div>

  <!-- Error message will show here -->
  <div id="errorMsg" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded-lg mb-4"></div>

  <!-- Today's weather card -->
<div id="tempAlert" class="hidden bg-red-600 text-white p-3 rounded-lg mb-2"></div>

<button id="unitToggle" class="mb-2 px-3 py-1 bg-slate-600 text-white rounded-lg">
  Show in °F
</button>

<div id="currentWeather" class="w-full max-w-md"></div>
  


  <!-- 5-day forecast cards -->
  <div id="forecast" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 mt-6 w-full max-w-4xl"></div>

</body>
</html>
